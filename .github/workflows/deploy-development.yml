# Deploy Kubernetes manifests to the development EKS cluster (Kustomize overlay).
# Prerequisites: images in ECR; kube access via OIDC; cluster name in GitHub secrets.
name: Deploy (Development)

on:
  workflow_dispatch: {}
  push:
    branches: [feat/k8s-deployment-manifests]
    paths:
      - "k8s/**"
      - ".github/workflows/deploy-development.yml"

env:
  AWS_REGION: us-east-1
  NAMESPACE: financial-analysis-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region "${{ env.AWS_REGION }}" --name "${{ secrets.EKS_CLUSTER_NAME_DEVELOPMENT }}"

      - name: Deploy (Kustomize)
        run: |
          kubectl apply -k k8s/overlays/development

      - name: Install/Upgrade Apache Airflow (Helm)
        run: |
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update
          helm upgrade --install airflow apache-airflow/airflow \
            --namespace airflow \
            --create-namespace \
            --values k8s/airflow/values-development.yaml \
            --set dags.gitSync.branch="${GITHUB_REF_NAME}" \
            --wait \
            --timeout 10m

      - name: Show status
        run: |
          kubectl get pods,svc,cronjob -n "${{ env.NAMESPACE }}" || true
          kubectl get pods,svc,ingress -n airflow || true
