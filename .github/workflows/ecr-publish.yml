# Build and push container images to Amazon ECR (scraper + ETL).
# Requires: GitHub secret AWS_GITHUB_ACTIONS_ROLE_ARN (OIDC), AWS_ACCOUNT_ID, and ECR permissions.
name: ECR Publish

on:
  push:
    branches: [main, master, feat/k8s-deployment-manifests]
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: financial-analysis-scraper
            dockerfile: services/scraper/Dockerfile
          - name: financial-analysis-etl
            dockerfile: services/etl/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        id: vars
        run: |
          ACCOUNT="${{ secrets.AWS_ACCOUNT_ID }}"
          REGISTRY="${ACCOUNT}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          echo "registry=${REGISTRY}" >> "${GITHUB_OUTPUT}"
          echo "image=${REGISTRY}/${{ matrix.name }}" >> "${GITHUB_OUTPUT}"

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ matrix.name }}" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "${{ matrix.name }}" >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
