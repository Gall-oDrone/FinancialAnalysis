apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: financial-analysis-dev

resources:
  - namespace.yaml
  - ../../base

patchesStrategicMerge:
  - development-patches.yaml

# Set image from Amazon ECR (option A: use `:latest` built by GitHub Actions)
images:
  # Base kustomization rewrites `financial-analysis-scraper` -> GHCR placeholder.
  # Override those placeholder image names to point at ECR instead.
  - name: ghcr.io/PLACEHOLDER_OWNER/financial-analysis-scraper
    newName: 326105557351.dkr.ecr.us-east-1.amazonaws.com/financial-analysis-scraper
    newTag: latest
  - name: ghcr.io/PLACEHOLDER_OWNER/financial-analysis-etl
    newName: 326105557351.dkr.ecr.us-east-1.amazonaws.com/financial-analysis-etl
    newTag: latest
