# Secret for financial-analysis (replace with External Secrets or sealed-secrets in production)
# Do not commit real values; use CI/CD or secret managers.
apiVersion: v1
kind: Secret
metadata:
  name: financial-analysis-secrets
  labels:
    app: financial-analysis
type: Opaque
stringData:
  # PostgreSQL password (override in overlays or use External Secrets)
  pg-password: "REPLACE_WITH_SECURE_PASSWORD"
  # Optional: AWS for S3 (leave empty if not using S3 in this env)
  aws-access-key-id: ""
  aws-secret-access-key: ""
