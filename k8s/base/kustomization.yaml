apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - scraper.yaml
  - cronjobs-etl.yaml
  - airflow-rbac.yaml

commonLabels:
  app: financial-analysis

images:
  # Override in overlays with ECR or GHCR
  - name: financial-analysis-scraper
    newName: ghcr.io/PLACEHOLDER_OWNER/financial-analysis-scraper
    newTag: latest
  - name: financial-analysis-etl
    newName: ghcr.io/PLACEHOLDER_OWNER/financial-analysis-etl
    newTag: latest
