# PostgreSQL for financial-analysis pipeline
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: financial-analysis
    component: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: financial-analysis
      component: postgres
  template:
    metadata:
      labels:
        app: financial-analysis
        component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: financial-analysis-config
                  key: pg-dbname
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: financial-analysis-config
                  key: pg-user
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: financial-analysis-secrets
                  key: pg-password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - financial_user
                - -d
                - financial_db
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - financial_user
                - -d
                - financial_db
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: financial-analysis
    component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: financial-analysis
    component: postgres
