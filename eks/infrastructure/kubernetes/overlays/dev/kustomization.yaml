apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: financial-analysis-dev

namespace: financial-analysis

resources:
  - ../../base

commonLabels:
  environment: dev

patches:
  - patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: "development"
      - op: replace
        path: /data/DEBUG
        value: "True"
      - op: replace
        path: /data/LOG_LEVEL
        value: "DEBUG"
      - op: replace
        path: /data/SCRAPING_DEBUG
        value: "True"
    target:
      kind: ConfigMap
      name: financial-analysis-config

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: financial-scraper

  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
    target:
      kind: Deployment
      name: financial-scraper

  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
    target:
      kind: HorizontalPodAutoscaler
      name: financial-scraper-hpa

images:
  - name: ${ECR_REPOSITORY_URL}
    newTag: dev

