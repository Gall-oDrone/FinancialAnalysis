apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: financial-analysis-network-policy
  namespace: financial-analysis
  labels:
    app.kubernetes.io/name: financial-analysis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: financial-analysis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from same namespace
    - from:
        - podSelector: {}
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTPS (for external APIs)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    # Allow HTTP (for some scraped sites)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 80
    # Allow PostgreSQL to RDS
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 5432

