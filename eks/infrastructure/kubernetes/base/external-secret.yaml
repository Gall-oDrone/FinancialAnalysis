apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: financial-analysis-db-secret
  namespace: financial-analysis
  labels:
    app.kubernetes.io/name: financial-analysis
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        PGDBHOST: "{{ .host }}"
        PGDBPORT: "{{ .port }}"
        PGDBNAME: "{{ .dbname }}"
        PGDBUSER: "{{ .username }}"
        PGDBPASS: "{{ .password }}"
  data:
    - secretKey: host
      remoteRef:
        key: financial-analysis/${ENVIRONMENT}/db-credentials
        property: host
    - secretKey: port
      remoteRef:
        key: financial-analysis/${ENVIRONMENT}/db-credentials
        property: port
    - secretKey: dbname
      remoteRef:
        key: financial-analysis/${ENVIRONMENT}/db-credentials
        property: dbname
    - secretKey: username
      remoteRef:
        key: financial-analysis/${ENVIRONMENT}/db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: financial-analysis/${ENVIRONMENT}/db-credentials
        property: password

