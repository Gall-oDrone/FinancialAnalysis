apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: financial-analysis-base

namespace: financial-analysis

resources:
  - namespace.yaml
  - service-account.yaml
  - configmap.yaml
  - external-secret.yaml
  - deployment-scraper.yaml
  - cronjob-scraper.yaml
  - hpa.yaml
  - network-policy.yaml
  - pdb.yaml

commonLabels:
  app.kubernetes.io/name: financial-analysis
  app.kubernetes.io/part-of: financial-analysis
  app.kubernetes.io/managed-by: kustomize

