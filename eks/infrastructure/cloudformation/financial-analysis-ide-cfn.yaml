AWSTemplateFormatVersion: "2010-09-09"
Description: Creates a code-server IDE for Financial Analysis with Jupyter Notebook and GitHub CLI

Parameters:
  InstanceVolumeSize:
    Type: Number
    Description: The size in GB of the IDE instance volume.
    Default: 50
  RepositoryOwner:
    Type: String
    Description: The owner of the GitHub repository to bootstrap the IDE
    Default: "Gall-oDrone"
  RepositoryName:
    Type: String
    Description: The name of the GitHub repository to bootstrap the IDE
    Default: "financial_analysis"
  RepositoryRef:
    Type: String
    Description: The Git reference to bootstrap the IDE
    Default: "main"
  CodeServerVersion:
    Type: String
    Description: code-server version to use
    Default: "4.91.1"
  AmiParameterStoreName:
    Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>"
    Default: "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64"
  InstanceProfileName:
    Type: String
    Description: Name of the IAM instance profile to attach to the IDE EC2 instance

Conditions:
  IsKnownRegion: !Not
    - !Equals
      - !FindInMap [PrefixListID, !Ref "AWS::Region", PrefixList]
      - ""

Mappings:
  PrefixListID:
    us-east-1:
      PrefixList: pl-3b927c52
    us-east-2:
      PrefixList: pl-b6a144df
    us-west-1:
      PrefixList: pl-4ea04527
    us-west-2:
      PrefixList: pl-82a045eb
    eu-central-1:
      PrefixList: pl-a3a144ca
    eu-west-1:
      PrefixList: pl-4fa04526
    eu-west-2:
      PrefixList: pl-93a247fa
    ap-northeast-1:
      PrefixList: pl-58a04531
    ap-southeast-1:
      PrefixList: pl-31a34658
    ap-southeast-2:
      PrefixList: pl-b8a742d1
    default:
      PrefixList: ""

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: 10.0.0.0/24
      VpcId: !Ref VPC
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]
  PublicSubnetRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
  PublicSubnetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicSubnetRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetRouteTableAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicSubnetRouteTable
      SubnetId: !Ref PublicSubnet
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SG for Financial Analysis IDE
      SecurityGroupIngress:
        - Description: Allow IDE and Jupyter from CloudFront
          IpProtocol: tcp
          FromPort: 80
          ToPort: 8899
          SourcePrefixListId: !If
            - IsKnownRegion
            - !FindInMap [PrefixListID, !Ref "AWS::Region", PrefixList]
            - !FindInMap [PrefixListID, "us-east-1", PrefixList]
      SecurityGroupEgress:
        - Description: Allow all outbound
          IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      VpcId: !Ref VPC

  FinancialAnalysisIdeBootstrapLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/ssm/${AWS::StackName}/bootstrap
      RetentionInDays: 14

  FinancialAnalysisIdeLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BootstrapLambdaPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
              - Effect: Allow
                Action:
                  - iam:PassRole
                  - ssm:SendCommand
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                  - ssm:DescribeInstanceInformation
                Resource: "*"

  FinancialAnalysisIdeBootstrapInstanceLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.handler
      Role: !GetAtt FinancialAnalysisIdeLambdaExecutionRole.Arn
      Runtime: python3.12
      Timeout: 900
      MemorySize: 256
      Environment:
        Variables:
          DiskSize: !Ref InstanceVolumeSize
      Code:
        ZipFile: |
          import boto3, time, traceback, json, urllib.request
          SUCCESS, FAILED = "SUCCESS", "FAILED"
          def send(event, context, status, data):
            body = json.dumps({"Status": status, "Reason": str(data), "PhysicalResourceId": event.get("PhysicalResourceId", "bootstrap"), "StackId": event["StackId"], "RequestId": event["RequestId"], "LogicalResourceId": event["LogicalResourceId"], "Data": data})
            req = urllib.request.Request(event["ResponseURL"], data=body.encode(), method="PUT", headers={"content-type": ""})
            urllib.request.urlopen(req)
          def handler(event, context):
            if event.get("RequestType") == "Delete":
              send(event, context, SUCCESS, {}); return
            try:
              ssm = boto3.client("ssm")
              instance_id = event["ResourceProperties"]["InstanceId"]
              ssm_document = event["ResourceProperties"]["SsmDocument"]
              log_group = event["ResourceProperties"].get("BootstrapLogGroup")
              time.sleep(60)
              args = {"InstanceIds": [instance_id], "DocumentName": ssm_document, "TimeoutSeconds": 1800}
              if log_group:
                args["CloudWatchOutputConfig"] = {"CloudWatchLogGroupName": log_group, "CloudWatchOutputEnabled": True}
              r = ssm.send_command(**args)
              cmd_id = r["Command"]["CommandId"]
              waiter = ssm.get_waiter("command_executed")
              waiter.wait(CommandId=cmd_id, InstanceId=instance_id, WaiterConfig={"Delay": 10, "MaxAttempts": 90})
              inv = ssm.get_command_invocation(CommandId=cmd_id, InstanceId=instance_id)
              if inv["Status"] != "Success":
                raise Exception(inv.get("StandardErrorContent", inv["Status"]))
              send(event, context, SUCCESS, {"CommandId": cmd_id})
            except Exception as e:
              traceback.print_exc()
              send(event, context, FAILED, {"Error": str(e)})

  FinancialAnalysisIdeBootstrapInstanceLambda:
    Type: Custom::FinancialAnalysisIdeBootstrapInstanceLambda
    DependsOn:
      - FinancialAnalysisIdeLambdaExecutionRole
      - FinancialAnalysisIdeInstance
      - FinancialAnalysisIdeSSMDocument
      - FinancialAnalysisIdePassword
      - FinancialAnalysisIdeBootstrapLogGroup
    Properties:
      ServiceToken: !GetAtt FinancialAnalysisIdeBootstrapInstanceLambdaFunction.Arn
      InstanceId: !Ref FinancialAnalysisIdeInstance
      SsmDocument: !Ref FinancialAnalysisIdeSSMDocument
      BootstrapLogGroup: !Ref FinancialAnalysisIdeBootstrapLogGroup

  FinancialAnalysisIdePassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-password
      GenerateSecretString:
        SecretStringTemplate: '{"username":"ec2-user"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete

  FinancialAnalysisIdeInstance:
    Type: AWS::EC2::Instance
    DependsOn: FinancialAnalysisIdePassword
    Properties:
      ImageId: !Ref AmiParameterStoreName
      InstanceType: t3.medium
      IamInstanceProfile: !Ref InstanceProfileName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref SecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: !Ref InstanceVolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-instance
        - Key: type
          Value: financial-analysis-ide
      UserData:
        Fn::Base64: |
          #!/bin/bash
          sleep 30
          echo "Instance ready for SSM" > /tmp/instance-ready

  FinancialAnalysisIdeSSMDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      Content:
        schemaVersion: "2.2"
        description: Bootstrap Financial Analysis IDE (code-server, Jupyter, GitHub CLI)
        mainSteps:
          - action: aws:runShellScript
            name: FinancialAnalysisIdeBootstrap
            inputs:
              timeoutSeconds: 1800
              runCommand:
                - !Sub |
                    #!/bin/bash
                    set -e
                    exec > >(tee -a /var/log/financial-analysis-bootstrap.log) 2>&1
                    error_exit() { echo "Error at line $1"; exit 1; }
                    trap 'error_exit $LINENO' ERR

                    echo "Installing packages (git, jq, argon2, etc.)..."
                    dnf install -y git tar gzip vim nodejs npm make gcc g++ jq unzip zip 2>/dev/null || true
                    dnf install -y argon2 2>/dev/null || yum install -y argon2 2>/dev/null || true

                    echo "Installing GitHub CLI..."
                    dnf install -y dnf-plugins-core 2>/dev/null || true
                    dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo 2>/dev/null || true
                    dnf install -y gh 2>/dev/null || (curl -sL https://github.com/cli/cli/releases/latest/download/gh_*_linux_amd64.tar.gz | tar xz -C /tmp && mv /tmp/gh_*/bin/gh /usr/local/bin/) || true

                    echo "Installing Docker..."
                    dnf install -y docker 2>/dev/null || yum install -y docker 2>/dev/null || true
                    systemctl enable docker && systemctl start docker
                    usermod -aG docker ec2-user

                    echo "Installing Docker Compose..."
                    curl -sL "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
                    chmod +x /usr/local/bin/docker-compose

                    echo "Installing Caddy..."
                    dnf copr enable -y @caddy/caddy 2>/dev/null || true
                    dnf install -y caddy 2>/dev/null || true
                    systemctl enable --now caddy

                    echo "Configuring Caddy (code-server on 8889)..."
                    echo 'http://:80 { reverse_proxy 127.0.0.1:8889 }' > /etc/caddy/Caddyfile
                    systemctl restart caddy

                    echo "Setting up ec2-user environment (code-server, Jupyter, GitHub CLI)..."
                    runuser -l ec2-user -c '
                    set -e
                    mkdir -p ~/environment
                    export PATH="$HOME/.local/bin:$PATH"

                    if ! command -v code-server &>/dev/null; then
                      echo "Installing code-server..."
                      curl -sL -o /tmp/coder.rpm https://github.com/coder/code-server/releases/download/v${CodeServerVersion}/code-server-${CodeServerVersion}-amd64.rpm || \
                        curl -sL -o /tmp/coder.rpm https://github.com/coder/code-server/releases/latest/download/code-server-amd64.rpm
                      sudo rpm -U /tmp/coder.rpm
                      sudo systemctl enable --now code-server@ec2-user
                    fi

                    PASSWORD_SECRET=$(aws secretsmanager get-secret-value --secret-id "${AWS::StackName}-password" --query SecretString --output text 2>/dev/null) || true
                    if [ -n "$PASSWORD_SECRET" ]; then
                      IDE_PW=$(echo "$PASSWORD_SECRET" | jq -r .password)
                      HASHED=$(echo -n "$IDE_PW" | argon2 saltItWithSalt -l 32 -e 2>/dev/null || echo "$IDE_PW")
                      mkdir -p ~/.config/code-server
                      echo "bind-addr: 127.0.0.1:8889
                    auth: password
                    hashed-password: \"$HASHED\"
                    cert: false" > ~/.config/code-server/config.yaml
                    fi

                    echo "Installing Jupyter Lab..."
                    pip3 install --user jupyterlab 2>/dev/null || true
                    nohup jupyter lab --port 8888 --no-browser --ServerApp.token="" --ServerApp.password="" --ServerApp.base_url=/jupyter --ip=0.0.0.0 > /tmp/jupyter.log 2>&1 &
                    echo $! > /tmp/jupyter.pid

                    echo "Verifying GitHub CLI..."
                    gh --version 2>/dev/null || true
                    '
                    sudo systemctl restart code-server@ec2-user 2>/dev/null || true
                    echo "Bootstrap completed."

Outputs:
  InstanceId:
    Description: EC2 Instance ID of the IDE
    Value: !Ref FinancialAnalysisIdeInstance
  InstancePublicDnsName:
    Description: Public DNS name of the IDE instance (for CloudFront)
    Value: !GetAtt FinancialAnalysisIdeInstance.PublicDnsName
  IdePasswordSecretName:
    Description: Name of the secret containing the IDE password
    Value: !Sub ${AWS::StackName}-password
  IdePasswordSecret:
    Description: Link to Secrets Manager to retrieve the password
    Value: !Sub
      - "https://console.aws.amazon.com/secretsmanager/secret?name=${SecretName}&region=${AWS::Region}"
      - SecretName: !Sub ${AWS::StackName}-password
