AWSTemplateFormatVersion: "2010-09-09"
Description: Financial Analysis - IDE Instance with Code-Server and Jupyter Notebook

# =============================================================================
# Parameters
# =============================================================================
Parameters:
  ProjectName:
    Type: String
    Default: financial-analysis
    Description: Name of the project

  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name

  InstanceVolumeSize:
    Type: Number
    Description: The Size in GB of the IDE Instance Volume
    Default: 50

  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues:
      - t3.small
      - t3.medium
      - t3.large
      - t3.xlarge
      - m5.large
      - m5.xlarge
    Description: EC2 instance type for IDE

  RepositoryOwner:
    Type: String
    Description: The owner of the GitHub repository to bootstrap
    Default: "Gall-oDrone"

  RepositoryName:
    Type: String
    Description: The name of the GitHub repository to bootstrap
    Default: "financial_analysis"

  RepositoryRef:
    Type: String
    Description: The Git reference (branch/tag) to bootstrap
    Default: "main"

  CodeServerVersion:
    Type: String
    Description: Default code-server version to use
    Default: "4.91.1"

  JupyterPassword:
    Type: String
    NoEcho: true
    Description: Password for Jupyter Notebook (leave empty to auto-generate)
    Default: ""

  AmiParameterStoreName:
    Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>"
    Default: "/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64"

# =============================================================================
# Conditions
# =============================================================================
Conditions:
  IsKnownRegion: !Not
    - !Equals
      - !FindInMap [PrefixListID, !Ref "AWS::Region", PrefixList, "default": ""]
      - ""
  IsProd: !Equals [!Ref Environment, "prod"]

# =============================================================================
# Mappings - CloudFront Prefix Lists by Region
# =============================================================================
Mappings:
  PrefixListID:
    us-east-1:
      PrefixList: pl-3b927c52
    us-east-2:
      PrefixList: pl-b6a144df
    us-west-1:
      PrefixList: pl-4ea04527
    us-west-2:
      PrefixList: pl-82a045eb
    eu-central-1:
      PrefixList: pl-a3a144ca
    eu-north-1:
      PrefixList: pl-fab65393
    eu-west-1:
      PrefixList: pl-4fa04526
    eu-west-2:
      PrefixList: pl-93a247fa
    eu-west-3:
      PrefixList: pl-75b1541c
    eu-south-1:
      PrefixList: pl-1bfc5972
    ap-northeast-1:
      PrefixList: pl-58a04531
    ap-northeast-2:
      PrefixList: pl-22a6434b
    ap-northeast-3:
      PrefixList: pl-31a14658
    ap-south-1:
      PrefixList: pl-9aa247f3
    ap-southeast-1:
      PrefixList: pl-31a34658
    ap-southeast-2:
      PrefixList: pl-b8a742d1
    sa-east-1:
      PrefixList: pl-5da64334
    ca-central-1:
      PrefixList: pl-38a64351

# =============================================================================
# Resources
# =============================================================================
Resources:
  # ---------------------------------------------------------------------------
  # VPC Resources for IDE
  # ---------------------------------------------------------------------------
  IdeVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-ide-vpc"
        - Key: Environment
          Value: !Ref Environment

  IdeInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-ide-igw"
        - Key: Environment
          Value: !Ref Environment

  IdeGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref IdeVPC
      InternetGatewayId: !Ref IdeInternetGateway

  IdePublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: 10.0.0.0/24
      VpcId: !Ref IdeVPC
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-ide-public-subnet"
        - Key: Environment
          Value: !Ref Environment

  IdeRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref IdeVPC
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-ide-rt"
        - Key: Environment
          Value: !Ref Environment

  IdePublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IdeGatewayAttachment
    Properties:
      RouteTableId: !Ref IdeRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IdeInternetGateway

  IdeRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref IdeRouteTable
      SubnetId: !Ref IdePublicSubnet

  # ---------------------------------------------------------------------------
  # Security Group for IDE
  # ---------------------------------------------------------------------------
  IdeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${ProjectName}-${Environment}-ide-sg"
      GroupDescription: Security group for Financial Analysis IDE
      VpcId: !Ref IdeVPC
      SecurityGroupIngress:
        - Description: Allow IDE and Jupyter ports from CloudFront
          IpProtocol: tcp
          FromPort: 80
          ToPort: 8899
          SourcePrefixListId: !If
            - IsKnownRegion
            - !FindInMap [PrefixListID, !Ref "AWS::Region", PrefixList]
            - !FindInMap [PrefixListID, "us-east-1", PrefixList]
      SecurityGroupEgress:
        - Description: Allow all outbound traffic
          IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-ide-sg"
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # Secrets Manager - IDE Password
  # ---------------------------------------------------------------------------
  IdePassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-ide-password"
      Description: Password for Financial Analysis IDE (code-server and Jupyter)
      GenerateSecretString:
        ExcludeCharacters: "\"@/\\"
        ExcludePunctuation: true
        GenerateStringKey: password
        IncludeSpace: false
        PasswordLength: 32
        SecretStringTemplate: '{"password":""}'
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-ide-password"
        - Key: Environment
          Value: !Ref Environment
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete

  # ---------------------------------------------------------------------------
  # SSM Document for Bootstrap
  # ---------------------------------------------------------------------------
  IdeSSMDocument:
    Type: AWS::SSM::Document
    Properties:
      DocumentType: Command
      DocumentFormat: YAML
      Content:
        schemaVersion: "2.2"
        description: Bootstrap Financial Analysis IDE Instance
        mainSteps:
          - action: aws:runShellScript
            name: FinancialAnalysisIdeBootstrap
            inputs:
              timeoutSeconds: 1800
              runCommand:
                - !Sub |
                  #!/bin/bash
                  set -e

                  # Error handling function
                  error_exit() {
                      echo "Error on line $1"
                      exit 1
                  }
                  trap 'error_exit $LINENO' ERR

                  echo "Starting bootstrap process for Financial Analysis IDE..."

                  # Install packages with retry logic
                  install_packages() {
                      local max_attempts=3
                      local attempt=1
                      while [ $attempt -le $max_attempts ]; do
                          echo "Attempt $attempt to install packages..."
                          if yum install -y git tar gzip vim nodejs npm make gcc g++ argon2 python3 python3-pip jq; then
                              echo "Package installation successful"
                              return 0
                          fi
                          echo "Package installation failed, retrying..."
                          sleep 5
                          attempt=$((attempt + 1))
                      done
                      return 1
                  }

                  install_packages || error_exit $LINENO

                  # Install Docker with retry
                  echo "Installing Docker..."
                  max_attempts=3
                  attempt=1
                  while [ $attempt -le $max_attempts ]; do
                      if dnf install docker -y; then
                          break
                      fi
                      sleep 5
                      attempt=$((attempt + 1))
                  done

                  systemctl enable docker
                  systemctl start docker
                  usermod -a -G docker ec2-user

                  # Install Docker Compose
                  echo "Installing Docker Compose..."
                  max_attempts=3
                  attempt=1
                  while [ $attempt -le $max_attempts ]; do
                      if sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" \
                          -o /usr/local/bin/docker-compose; then
                          sudo chmod +x /usr/local/bin/docker-compose
                          if docker-compose version; then
                              echo "Docker Compose installed successfully"
                              break
                          fi
                      fi
                      echo "Docker Compose installation attempt $attempt failed, retrying..."
                      sleep 5
                      attempt=$((attempt + 1))
                  done

                  # Install Caddy
                  echo "Installing Caddy..."
                  dnf copr enable -y @caddy/caddy epel-9-x86_64 || error_exit $LINENO
                  dnf install -y caddy || error_exit $LINENO
                  systemctl enable --now caddy

                  # Configure Caddy for code-server and Jupyter
                  echo "Configuring Caddy..."
                  tee /etc/caddy/Caddyfile <<EOF
                  http://${IdeCloudFrontDistribution.DomainName} {
                    reverse_proxy 127.0.0.1:8889
                  }
                  EOF

                  systemctl restart caddy

                  # Setup custom prompt
                  tee /etc/profile.d/custom_prompt.sh <<EOF
                  #!/bin/sh
                  export PROMPT_COMMAND='export PS1="\u:\w:$ "'
                  EOF

                  # Export environment variables
                  export AWS_REGION="${AWS::Region}"
                  export PROJECT_NAME="${ProjectName}"
                  export ENVIRONMENT="${Environment}"
                  export REPOSITORY_OWNER="${RepositoryOwner}"
                  export REPOSITORY_NAME="${RepositoryName}"
                  export REPOSITORY_REF="${RepositoryRef}"

                  # Setup user environment
                  echo "Setting up user environment..."
                  cat <<"EOT" | sudo -E -H -u ec2-user bash
                  set -e

                  # Error handling for user script
                  error_exit() {
                      echo "User script error on line $1"
                      exit 1
                  }
                  trap 'error_exit $LINENO' ERR

                  mkdir -p ~/environment

                  # Install code-server if not already installed
                  codeServer=$(dnf list installed code-server 2>/dev/null | wc -l)
                  if [ "$codeServer" -eq "0" ]; then
                      echo "Installing code-server..."
                      curl -Ls -o /tmp/coder.rpm https://github.com/coder/code-server/releases/download/v${CodeServerVersion}/code-server-${CodeServerVersion}-amd64.rpm || {
                          echo "Specific version failed, trying latest..."
                          curl -Ls -o /tmp/coder.rpm https://github.com/coder/code-server/releases/latest/download/code-server-amd64.rpm
                      }
                      sudo rpm -U "/tmp/coder.rpm"
                      sudo systemctl enable --now code-server@ec2-user
                  fi

                  # Retrieve password from Secrets Manager
                  echo "Retrieving password from Secrets Manager..."
                  max_attempts=5
                  attempt=1
                  while [ $attempt -le $max_attempts ]; do
                      PASSWORD_SECRET_VALUE=$(aws secretsmanager get-secret-value --secret-id "${IdePassword.Id}" --query 'SecretString' --output text 2>/dev/null) && break
                      echo "Attempt $attempt failed, retrying..."
                      sleep 5
                      attempt=$((attempt + 1))
                  done

                  if [ -z "$PASSWORD_SECRET_VALUE" ]; then
                      echo "Failed to retrieve password from Secrets Manager"
                      exit 1
                  fi

                  IDE_PASSWORD=$(echo "$PASSWORD_SECRET_VALUE" | jq -r '.password')
                  HASHED_PASSWORD=$(echo -n "$IDE_PASSWORD" | argon2 saltItWithSalt -l 32 -e)

                  # Configure code-server
                  mkdir -p ~/.config/code-server
                  touch ~/.config/code-server/config.yaml
                  tee ~/.config/code-server/config.yaml <<EOF
                  cert: false
                  auth: password
                  hashed-password: "$HASHED_PASSWORD"
                  bind-addr: 127.0.0.1:8889
                  EOF

                  # Install Python packages for Financial Analysis
                  echo "Installing Python packages..."
                  pip3 install --user \
                      jupyterlab \
                      notebook \
                      pandas \
                      numpy \
                      scipy \
                      matplotlib \
                      seaborn \
                      plotly \
                      scikit-learn \
                      yfinance \
                      requests \
                      beautifulsoup4 \
                      lxml \
                      psycopg2-binary \
                      sqlalchemy \
                      boto3 \
                      python-dotenv \
                      pyspark \
                      kafka-python \
                      websocket-client

                  # Configure Jupyter Notebook
                  echo "Configuring Jupyter Notebook..."
                  mkdir -p ~/.jupyter
                  JUPYTER_PASSWORD_HASH=$(python3 -c "from notebook.auth import passwd; print(passwd('$IDE_PASSWORD', algorithm='sha256'))")

                  tee ~/.jupyter/jupyter_notebook_config.py <<EOF
                  c = get_config()
                  c.NotebookApp.ip = '0.0.0.0'
                  c.NotebookApp.port = 8888
                  c.NotebookApp.open_browser = False
                  c.NotebookApp.password = '$JUPYTER_PASSWORD_HASH'
                  c.NotebookApp.allow_root = False
                  c.NotebookApp.allow_remote_access = True
                  c.NotebookApp.base_url = '/jupyter/'
                  c.NotebookApp.tornado_settings = {'headers': {'Content-Security-Policy': "frame-ancestors 'self' *"}}
                  c.NotebookApp.notebook_dir = '/home/ec2-user/environment'
                  c.NotebookApp.token = ''
                  c.NotebookApp.disable_check_xsrf = True
                  EOF

                  # Configure JupyterLab
                  mkdir -p ~/.jupyter/lab/user-settings/@jupyterlab/apputils-extension
                  tee ~/.jupyter/lab/user-settings/@jupyterlab/apputils-extension/themes.jupyterlab-settings <<EOF
                  {
                      "theme": "JupyterLab Dark"
                  }
                  EOF

                  # Create systemd service for Jupyter
                  sudo tee /etc/systemd/system/jupyter.service <<EOF
                  [Unit]
                  Description=Jupyter Notebook Server
                  After=network.target

                  [Service]
                  Type=simple
                  User=ec2-user
                  ExecStart=/home/ec2-user/.local/bin/jupyter lab --config=/home/ec2-user/.jupyter/jupyter_notebook_config.py
                  WorkingDirectory=/home/ec2-user/environment
                  Restart=always
                  RestartSec=10
                  Environment="PATH=/home/ec2-user/.local/bin:/usr/local/bin:/usr/bin:/bin"

                  [Install]
                  WantedBy=multi-user.target
                  EOF

                  sudo systemctl daemon-reload
                  sudo systemctl enable jupyter
                  sudo systemctl start jupyter

                  # Clone repository
                  echo "Cloning repository..."
                  cd ~/environment
                  if [ ! -d "${RepositoryName}" ]; then
                      git clone https://github.com/${RepositoryOwner}/${RepositoryName}.git || echo "Repository clone failed, continuing..."
                  fi

                  # Install VS Code extensions for Financial Analysis
                  echo "Installing VS Code extensions..."
                  code-server --install-extension ms-python.python || true
                  code-server --install-extension ms-toolsai.jupyter || true
                  code-server --install-extension redhat.vscode-yaml || true
                  code-server --install-extension hashicorp.terraform || true
                  code-server --install-extension amazonwebservices.aws-toolkit-vscode || true

                  EOT

                  # Restart code-server to apply configuration
                  echo "Restarting code-server..."
                  systemctl restart code-server@ec2-user

                  echo "Bootstrap completed successfully!"

  # ---------------------------------------------------------------------------
  # Lambda Execution Role for Bootstrap
  # ---------------------------------------------------------------------------
  IdeLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-ide-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Path: "/"
      Policies:
        - PolicyName: !Sub "${ProjectName}-${Environment}-ide-lambda-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
              - Effect: Allow
                Action:
                  - iam:PassRole
                  - ssm:SendCommand
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-ide-lambda-role"
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # Bootstrap Lambda Function
  # ---------------------------------------------------------------------------
  IdeBootstrapLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-ide-bootstrap"
      Handler: index.lambda_handler
      Role: !GetAtt IdeLambdaExecutionRole.Arn
      Runtime: python3.12
      MemorySize: 256
      Timeout: 900
      Environment:
        Variables:
          DiskSize: !Ref InstanceVolumeSize
      Code:
        ZipFile: |
          from __future__ import print_function
          import boto3
          import json
          import os
          import time
          import traceback
          import cfnresponse
          import logging
          logger = logging.getLogger(__name__)

          def lambda_handler(event, context):
              print(event.values())
              print('context: {}'.format(context))
              responseData = {}
              status = cfnresponse.SUCCESS

              if event['RequestType'] == 'Delete':
                  responseData = {'Success': 'Custom Resource removed'}
                  cfnresponse.send(event, context, status, responseData, 'CustomResourcePhysicalID')
              else:
                  try:
                      ssm = boto3.client('ssm')
                      instance_id = event['ResourceProperties']['InstanceId']
                      ssm_document = event['ResourceProperties']['SsmDocument']

                      print('Waiting for instance to be ready...')
                      time.sleep(30)

                      print('Sending SSM command...')
                      max_retries = 3
                      for attempt in range(max_retries):
                          try:
                              response = ssm.send_command(
                                  InstanceIds=[instance_id],
                                  DocumentName=ssm_document,
                                  TimeoutSeconds=1800)
                              command_id = response['Command']['CommandId']
                              print(f'Command sent successfully: {command_id}')
                              break
                          except Exception as e:
                              if attempt < max_retries - 1:
                                  print(f'Attempt {attempt + 1} failed, retrying...')
                                  time.sleep(10)
                              else:
                                  raise e

                      waiter = ssm.get_waiter('command_executed')
                      waiter.wait(
                          CommandId=command_id,
                          InstanceId=instance_id,
                          WaiterConfig={'Delay': 10, 'MaxAttempts': 90}
                      )

                      result = ssm.get_command_invocation(
                          CommandId=command_id,
                          InstanceId=instance_id
                      )

                      if result['Status'] != 'Success':
                          print(f"Command failed with status: {result['Status']}")
                          print(f"Error output: {result.get('StandardErrorContent', 'No error output')}")
                          raise Exception(f"SSM command failed with status: {result['Status']}")

                      responseData = {'Success': 'Started bootstrapping for instance: ' + instance_id}
                      cfnresponse.send(event, context, status, responseData, 'CustomResourcePhysicalID')

                  except Exception as e:
                      status = cfnresponse.FAILED
                      print(traceback.format_exc())
                      responseData = {'Error': str(e)}
                  finally:
                      cfnresponse.send(event, context, status, responseData, 'CustomResourcePhysicalID')
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-ide-bootstrap"
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # IDE Instance Role
  # ---------------------------------------------------------------------------
  IdeInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-ide-instance-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
                - ssm.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: ide-secrets-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetResourcePolicy
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                  - secretsmanager:ListSecretVersionIds
                Resource:
                  - !Ref IdePassword
              - Effect: Allow
                Action: secretsmanager:ListSecrets
                Resource: "*"
        - PolicyName: ide-ecr-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: "*"
        - PolicyName: ide-s3-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectName}-${Environment}-*"
                  - !Sub "arn:aws:s3:::${ProjectName}-${Environment}-*/*"
        - PolicyName: ide-eks-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - eks:DescribeCluster
                  - eks:ListClusters
                Resource: "*"
      Path: "/"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-ide-instance-role"
        - Key: Environment
          Value: !Ref Environment

  IdeInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${ProjectName}-${Environment}-ide-instance-profile"
      Path: "/"
      Roles:
        - !Ref IdeInstanceRole

  # ---------------------------------------------------------------------------
  # IDE EC2 Instance
  # ---------------------------------------------------------------------------
  IdeInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - IdeInstanceProfile
      - IdePassword
    Properties:
      ImageId: !Ref AmiParameterStoreName
      InstanceType: !Ref InstanceType
      BlockDeviceMappings:
        - Ebs:
            VolumeSize: !Ref InstanceVolumeSize
            VolumeType: gp3
            DeleteOnTermination: true
            Encrypted: true
          DeviceName: /dev/xvda
      SubnetId: !Ref IdePublicSubnet
      SecurityGroupIds:
        - !Ref IdeSecurityGroup
      IamInstanceProfile: !Ref IdeInstanceProfile
      Tags:
        - Key: type
          Value: financial-analysis-ide
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-ide-instance"
        - Key: Environment
          Value: !Ref Environment
        - Key: env
          Value: !Sub "${ProjectName}-${Environment}"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Wait for instance to be fully ready
          sleep 30
          # Signal that the instance is ready for SSM
          echo "Instance ready for SSM commands" > /tmp/instance-ready

  # ---------------------------------------------------------------------------
  # CloudFront Cache Policy
  # ---------------------------------------------------------------------------
  IdeCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        DefaultTTL: 86400
        MaxTTL: 31536000
        MinTTL: 1
        Name: !Sub "${ProjectName}-${Environment}-ide-cache-policy"
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig:
            CookieBehavior: all
          EnableAcceptEncodingGzip: false
          EnableAcceptEncodingBrotli: false
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers:
              - Accept-Charset
              - Authorization
              - Origin
              - Accept
              - Referer
              - Host
              - Accept-Language
              - Accept-Datetime
          QueryStringsConfig:
            QueryStringBehavior: all

  # ---------------------------------------------------------------------------
  # CloudFront Distribution
  # ---------------------------------------------------------------------------
  IdeCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn:
      - IdeInstance
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        Comment: !Sub "${ProjectName} ${Environment} IDE Distribution"
        CacheBehaviors:
          # WebSocket proxy for code-server
          - AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            Compress: true
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
            TargetOriginId: !Sub "CloudFront-${ProjectName}-${Environment}-ide"
            ViewerProtocolPolicy: allow-all
            PathPattern: "/proxy/*"
          # WebSocket connections
          - AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            Compress: true
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
            TargetOriginId: !Sub "CloudFront-${ProjectName}-${Environment}-ide"
            ViewerProtocolPolicy: allow-all
            PathPattern: "/ws/*"
          # Jupyter Notebook path
          - AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            Compress: false
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
            TargetOriginId: !Sub "CloudFront-Jupyter-${ProjectName}-${Environment}"
            ViewerProtocolPolicy: redirect-to-https
            PathPattern: "/jupyter/*"
          # Jupyter API endpoints
          - AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            Compress: false
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
            TargetOriginId: !Sub "CloudFront-Jupyter-${ProjectName}-${Environment}"
            ViewerProtocolPolicy: redirect-to-https
            PathPattern: "/api/*"
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - PATCH
            - POST
            - DELETE
          CachePolicyId: !Ref IdeCachePolicy
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
          TargetOriginId: !Sub "CloudFront-${ProjectName}-${Environment}-ide"
          ViewerProtocolPolicy: allow-all
        Origins:
          # Code-server origin
          - DomainName: !GetAtt IdeInstance.PublicDnsName
            Id: !Sub "CloudFront-${ProjectName}-${Environment}-ide"
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
          # Jupyter Notebook origin
          - DomainName: !GetAtt IdeInstance.PublicDnsName
            Id: !Sub "CloudFront-Jupyter-${ProjectName}-${Environment}"
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 8888
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${Environment}-ide-cloudfront"
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # Bootstrap Custom Resource
  # ---------------------------------------------------------------------------
  IdeBootstrapCustomResource:
    Type: Custom::IdeBootstrap
    DependsOn:
      - IdeLambdaExecutionRole
      - IdeInstance
      - IdeSSMDocument
      - IdePassword
      - IdeCloudFrontDistribution
    Properties:
      ServiceToken: !GetAtt IdeBootstrapLambdaFunction.Arn
      REGION: !Ref "AWS::Region"
      InstanceId: !Ref IdeInstance
      SsmDocument: !Ref IdeSSMDocument

# =============================================================================
# Outputs
# =============================================================================
Outputs:
  IdeUrl:
    Description: URL to access the code-server IDE
    Value: !Sub "https://${IdeCloudFrontDistribution.DomainName}"

  JupyterUrl:
    Description: URL to access Jupyter Notebook
    Value: !Sub "https://${IdeCloudFrontDistribution.DomainName}/jupyter"

  IdePasswordSecretArn:
    Description: ARN of the secret containing the IDE password
    Value: !Ref IdePassword

  IdePasswordSecretName:
    Description: Name of the secret containing the IDE password
    Value: !Sub "${ProjectName}-${Environment}-ide-password"

  IdePasswordSecretConsoleUrl:
    Description: Link to AWS Secrets Manager console to retrieve the password
    Value: !Sub "https://console.aws.amazon.com/secretsmanager/secret?name=${ProjectName}-${Environment}-ide-password&region=${AWS::Region}"

  IdeInstanceId:
    Description: EC2 Instance ID of the IDE
    Value: !Ref IdeInstance

  IdeInstancePublicDns:
    Description: Public DNS of the IDE instance
    Value: !GetAtt IdeInstance.PublicDnsName

  IdeInstanceRoleArn:
    Description: IAM Role ARN used by the IDE instance
    Value: !GetAtt IdeInstanceRole.Arn

  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref IdeCloudFrontDistribution

  VpcId:
    Description: VPC ID for IDE
    Value: !Ref IdeVPC
    Export:
      Name: !Sub "${ProjectName}-${Environment}-IdeVpcId"

  SubnetId:
    Description: Subnet ID for IDE
    Value: !Ref IdePublicSubnet
    Export:
      Name: !Sub "${ProjectName}-${Environment}-IdeSubnetId"
